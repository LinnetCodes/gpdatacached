[project]
name = "gpdatacached"
dynamic = ["version"]
description = "Redis-based cross-process data sharing and caching library"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Linnet Codes", email = "linnet.codes@gmail.com" },
]
keywords = ["redis", "cache", "cross-process", "data-sharing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "gpconfig>=0.3.0",
    "pydantic>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
pandas = ["pandas>=2.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocs-static-i18n>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that sleep/wait for real TTL expiry",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 120

[project.urls]
Homepage = "https://github.com/linnetcodes/gpdatacached"
Documentation = "https://linnetcodes.github.io/gpdatacached"
Repository = "https://github.com/linnetcodes/gpdatacached"
Issues = "https://github.com/linnetcodes/gpdatacached/issues"
Changelog = "https://github.com/LinnetCodes/gpdatacached/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gpdatacached/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpdatacached"]

[tool.hatch.build.targets.sdist]
# Docs (English + Simplified Chinese) and the Chinese README are part of the
# package's documentation surface, so ship them in the source distribution.
# The wheel stays code-only.
include = [
    "/src/gpdatacached",
    "/docs",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]